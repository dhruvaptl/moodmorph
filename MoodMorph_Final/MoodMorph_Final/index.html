<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MoodMorph</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Inter:wght@400;500;600&family=Playfair+Display:wght@500;700&family=Lato:wght@400;700&family=Orbitron:wght@500;700&family=Rajdhani:wght@500;600&family=Pacifico&family=Nunito:wght@400;700&family=DM+Serif+Display&family=DM+Sans:wght@400;500&family=Space+Grotesk:wght@500;700&display=swap">
<style>
:root{--bg:#120a1f;--p:#c9a7ff;--a:#ff8fcf;--h:#f3d9ff;--t:#efe6ff;--fd:'Cormorant Garamond',serif;--fb:'Inter',sans-serif}
*{box-sizing:border-box}body{margin:0;min-height:100vh;color:var(--t);font-family:var(--fb);background:radial-gradient(900px 500px at 15% -10%,color-mix(in srgb,var(--p) 28%,transparent),transparent),radial-gradient(800px 500px at 100% 10%,color-mix(in srgb,var(--a) 22%,transparent),transparent),var(--bg);transition:background .8s,color .6s}
main{max-width:1060px;margin:auto;padding:28px 18px 60px}
h1,h2{font-family:var(--fd);font-weight:600;margin:0}h1{font-size:clamp(2.2rem,6vw,3.6rem);background:linear-gradient(90deg,var(--p),var(--a));-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{opacity:.75;margin:6px 0 22px;max-width:620px}
.glass{background:color-mix(in srgb,var(--t) 7%,transparent);border:1px solid color-mix(in srgb,var(--t) 16%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-radius:20px;padding:18px}
.row{display:flex;gap:10px;flex-wrap:wrap}input[type=text]{flex:1;min-width:200px;padding:14px 16px;border-radius:14px;border:1px solid color-mix(in srgb,var(--t) 22%,transparent);background:color-mix(in srgb,var(--bg) 70%,transparent);color:var(--t);font:inherit;font-size:1.05rem}
button{font:inherit;cursor:pointer;border:0;border-radius:14px;padding:12px 18px;color:var(--bg);background:linear-gradient(90deg,var(--p),var(--a));font-weight:600;transition:transform .2s}button:hover{transform:translateY(-2px)}
button.g{background:color-mix(in srgb,var(--t) 10%,transparent);color:var(--t);border:1px solid color-mix(in srgb,var(--t) 20%,transparent);font-weight:500;padding:9px 14px;font-size:.9rem}
.chips{margin:12px 0 0}.chips button{font-size:.82rem;padding:6px 12px;border-radius:99px}
.opts{margin-top:12px;font-size:.88rem;opacity:.85;display:flex;gap:18px;flex-wrap:wrap}label{display:flex;gap:6px;align-items:center}
#out{display:none;margin-top:22px;grid-template-columns:1.4fr 1fr;gap:16px}#out.on{display:grid;animation:in .6s}
@keyframes in{from{opacity:0;transform:translateY(14px)}}
canvas#art{width:100%;border-radius:14px;display:block}#ai img{width:100%;border-radius:14px;margin-top:10px}
.sw{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.sw div{border-radius:12px;height:84px;display:flex;align-items:flex-end;padding:6px;font-size:.72rem;font-weight:600;cursor:pointer;transition:transform .2s}.sw div:hover{transform:scale(1.06)}
.span{grid-column:1/-1}.tag{font-size:.72rem;opacity:.65;margin-top:10px}.big{font-family:var(--fd);font-size:2rem;line-height:1.1}
.note{font-size:.78rem;opacity:.7;margin-top:10px;line-height:1.4}.saved{margin-top:22px}.saved button{margin:4px 6px 0 0}
@media(max-width:760px){#out{grid-template-columns:1fr}}
</style></head><body><main>
<h1>MoodMorph</h1>
<p class="sub">Describe a mood, aesthetic or idea. MoodMorph turns it into a moodboard — and the interface itself morphs to match.</p>
<div class="glass">
 <form class="row" id="f"><input type="text" id="q" placeholder="e.g. dark feminine luxury" autocomplete="off"><button>Generate</button></form>
 <div class="chips row" id="chips"></div>
 <div class="opts">
  <label><input type="checkbox" id="morph" checked> Morph interface to the mood</label>
  <label><input type="checkbox" id="ext"> Also try external AI image (Pollinations; optional, may be unavailable)</label>
 </div>
</div>
<section id="out"></section>
<div class="saved glass" id="savedBox" style="display:none"><b>Saved moodboards</b><div id="saved"></div></div>
</main>
<script>
// ---------- Lexicon: transparent keyword -> mood parameters (NOT a neural model) ----------
// h=hue, d=darkness, e=energy, el=elegance, s=saturation, w=warmth (deltas)
const LEX={dark:{d:.35},midnight:{h:250,d:.45},night:{h:245,d:.35},black:{d:.45},noir:{d:.45,el:.3},feminine:{h:320,el:.25},luxury:{h:285,el:.45,d:.15},luxurious:{h:285,el:.45,d:.15},dreamy:{h:268,d:-.2,e:-.2},lavender:{h:268,d:-.1},purple:{h:275},violet:{h:270},summer:{h:38,w:.5,e:.2,d:-.35},cyberpunk:{h:305,e:.5,d:.4,s:.3},cyber:{h:300,e:.4,d:.3},neon:{h:315,e:.4,s:.3},city:{h:230,d:.1,e:.1},minimalist:{el:.3,e:-.3,s:-.3},minimal:{el:.3,e:-.3,s:-.3},coffee:{h:26,w:.5,d:.15,s:-.2},whimsical:{h:330,e:.3,d:-.3},playful:{e:.4,d:-.2},bedroom:{w:.2,e:-.2},cozy:{h:28,w:.5,e:-.2},ocean:{h:200,d:.05},sea:{h:195},forest:{h:140,d:.15},sunset:{h:14,w:.6,e:.1},rose:{h:345,el:.15},pink:{h:330},pastel:{d:-.4,s:-.2},gold:{h:45,el:.3,w:.4},vintage:{h:35,w:.4,s:-.2,el:.15},futuristic:{h:200,e:.3,el:.1},elegant:{el:.4},bold:{e:.35,s:.2},calm:{e:-.35,s:-.15},mystic:{h:280,d:.3,el:.2},gothic:{h:300,d:.4,el:.3},spring:{h:110,d:-.3,w:.2},autumn:{h:25,w:.5,d:.1},winter:{h:210,w:-.4,d:.1},tropical:{h:165,e:.4,w:.3,d:-.2},cherry:{h:350},blue:{h:215},green:{h:140},red:{h:5,e:.2},yellow:{h:52,w:.4,d:-.2},orange:{h:28,w:.4},bright:{d:-.3,e:.2},moody:{d:.3,e:-.1}};
const EXAMPLES=["Dark feminine luxury","Dreamy lavender summer","Cyberpunk city at midnight","Minimalist coffee brand","Whimsical bedroom aesthetic"];
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
function hash(s){let h=2166136261;for(const c of s){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return h>>>0}
function rng(seed){return()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function hex(h,s,l){h=((h%360)+360)%360;s=clamp(s,0,100)/100;l=clamp(l,0,100)/100;const a=s*Math.min(l,1-l);const f=n=>{const k=(n+h/30)%12;return Math.round(255*(l-a*Math.max(-1,Math.min(k-3,9-k,1))))};return'#'+[f(0),f(8),f(4)].map(x=>x.toString(16).padStart(2,'0')).join('')}

function analyse(text){
 const words=text.toLowerCase().match(/[a-z]+/g)||[];const a={d:.5,e:.4,el:.4,s:.6,w:0},hs=[],hit=[];
 for(const w of words){const k=LEX[w]||LEX[w.replace(/s$/,'')];if(!k)continue;hit.push(w);for(const f in a)a[f]+=k[f]||0;if(k.h!=null)hs.push(k.h)}
 for(const f of['d','e','el','s'])a[f]=clamp(a[f]);a.w=clamp(a.w,-1,1);
 let H;if(hs.length){let x=0,y=0;hs.forEach(h=>{x+=Math.cos(h*Math.PI/180);y+=Math.sin(h*Math.PI/180)});H=(Math.atan2(y,x)*180/Math.PI+360)%360}else H=hash(text)%360;
 return{...a,H,hit,fallback:!hs.length}
}
function palette(m){
 const dark=m.d>=.45,S=40+m.s*50,acc=m.H+(m.e>.55?150:35);
 return[
  {n:"Base",c:hex(m.H,m.s*35,dark?5+(1-m.d)*12:94+(.45-m.d)*8)},
  {n:"Primary",c:hex(m.H,S,dark?62:45)},
  {n:"Accent",c:hex(acc,S+5,dark?70:52)},
  {n:"Highlight",c:hex(m.H+(m.w>0?-28:28),S-10,dark?84:34)},
  {n:"Text",c:hex(m.H,12,dark?90:12)}]
}
function typeFor(m){
 if(m.e>.6&&m.d>.5)return{d:"Orbitron",b:"Rajdhani",why:"High energy + dark mood → geometric, techno display type."};
 if(m.e>.55&&m.d<=.5)return{d:"Pacifico",b:"Nunito",why:"High energy + light mood → rounded, playful letterforms."};
 if(m.el>.55&&m.d>.45)return{d:"Cormorant Garamond",b:"Inter",why:"High elegance + dark mood → high-contrast serif with a neutral sans."};
 if(m.el>.55)return{d:"Playfair Display",b:"Lato",why:"High elegance + light mood → classic editorial serif."};
 if(m.e<.3&&m.el>.3)return{d:"Inter",b:"Inter",why:"Low energy + restrained → single neutral family, minimal."};
 if(m.w>.3)return{d:"DM Serif Display",b:"DM Sans",why:"Warm mood → soft, friendly serif pairing."};
 return{d:"Space Grotesk",b:"DM Sans",why:"Balanced mood → modern grotesque pairing."}
}
function direction(m,text){
 const tone=m.d>.7?"deep, shadow-heavy":m.d>.45?"moody, low-key":"light, airy";
 const mv=m.e>.6?"sharp, high-contrast and kinetic":m.e>.3?"confident with measured movement":"soft, slow and spacious";
 const lx=m.el>.6?"Favour refined details: thin lines, generous margins, restrained ornament.":m.el>.35?"Balance polish with approachability.":"Keep it raw and direct; let colour do the work.";
 const wm=m.w>.3?"Warm undertones":m.w<-.3?"Cool undertones":"Neutral undertones";
 return`A ${tone} direction for “${text}”. Visual rhythm is ${mv}. ${wm} keep the palette cohesive. ${lx}`
}

// ---------- Procedural art (seeded canvas, deterministic per prompt) ----------
function drawArt(cv,pal,m,seed,W=900,H=600){
 cv.width=W;cv.height=H;const g=cv.getContext('2d'),r=rng(seed);
 const bg=g.createLinearGradient(0,0,W,H);bg.addColorStop(0,pal[0].c);bg.addColorStop(1,pal[1].c+'66');g.fillStyle=bg;g.fillRect(0,0,W,H);
 const sharp=m.e>.6;
 for(let i=0;i<7;i++){const x=r()*W,y=r()*H,rad=80+r()*220,c=pal[1+Math.floor(r()*3)].c;
  if(sharp&&i%2){g.save();g.translate(x,y);g.rotate(r()*Math.PI);g.fillStyle=c+'55';g.fillRect(-rad/2,-6,rad*1.6,12+r()*30);g.restore()}
  else{const rg=g.createRadialGradient(x,y,0,x,y,rad);rg.addColorStop(0,c+'cc');rg.addColorStop(1,c+'00');g.fillStyle=rg;g.beginPath();g.arc(x,y,rad,0,7);g.fill()}}
 if(m.el>.45){g.strokeStyle=pal[3].c+'88';g.lineWidth=1.2;for(let i=0;i<5;i++){g.beginPath();g.arc(r()*W,r()*H,60+r()*200,0,Math.PI*(.6+r()*1.2));g.stroke()}}
 for(let i=0;i<500;i++){g.fillStyle=pal[4].c+(r()<.5?'14':'0a');g.fillRect(r()*W,r()*H,1.6,1.6)}
}

// ---------- App ----------
const $=id=>document.getElementById(id);let cur=null;
function esc(value){return String(value).replace(/[&<>\"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[ch]))}
const FONTS=()=>cur?`'${cur.t.d}'`:'';
function applyTheme(pal,t){const s=document.documentElement.style;s.setProperty('--bg',pal[0].c);s.setProperty('--p',pal[1].c);s.setProperty('--a',pal[2].c);s.setProperty('--h',pal[3].c);s.setProperty('--t',pal[4].c);s.setProperty('--fd',`'${t.d}',serif`);s.setProperty('--fb',`'${t.b}',sans-serif`)}
function resetTheme(){document.documentElement.removeAttribute('style')}
function generate(text){
 text=text.trim();if(!text)return;const m=analyse(text),pal=palette(m),t=typeFor(m),dir=direction(m,text);
 cur={text,m,pal,t,dir};$('q').value=text;if($('morph').checked)applyTheme(pal,t);else resetTheme();
 const o=$('out');o.className='on';o.innerHTML=`
 <div class="glass"><canvas id="art"></canvas><div id="ai"></div>
  <p class="note">${m.fallback?"No known keywords matched, so the hue was derived from a hash of your text (deterministic, not semantic).":"Matched keywords: <b>"+esc(m.hit.join(", "))+"</b>."} Art is procedurally generated in your browser from a seed — algorithmic, not a neural image model.</p></div>
 <div class="glass"><h2>Palette</h2><div class="sw" style="margin-top:12px">${pal.map(p=>`<div data-c="${p.c}" style="background:${p.c};color:${parseInt(p.c.slice(1,3),16)*.3+parseInt(p.c.slice(3,5),16)*.6>140?'#111':'#fff'}" title="Click to copy">${p.n}<br>${p.c}</div>`).join('')}</div>
  <div class="tag" id="cp">Click a swatch to copy its HEX.</div>
  <h2 style="margin-top:18px">Typography</h2><div class="big" style="font-family:'${t.d}'">${t.d}</div><div style="font-family:'${t.b}'">${t.b} — body text sample for ${esc(text)}.</div><div class="tag">${t.why}</div></div>
 <div class="glass span"><h2>Design direction</h2><p>${esc(dir)}</p>
  <div class="row"><button id="png">Download PNG</button><button class="g" id="css">Copy CSS variables</button><button class="g" id="json">Download JSON</button><button class="g" id="save">Save moodboard</button><button class="g" id="again">Regenerate variation</button></div></div>`;
 cur.seed=hash(text);drawArt($('art'),pal,m,cur.seed);
 if($('ext').checked){const u='https://image.pollinations.ai/prompt/'+encodeURIComponent(text+', moodboard, '+m.hit.join(' ')+', aesthetic, high quality')+'?width=1024&height=640&nologo=true&seed='+(cur.seed%99999);
  $('ai').innerHTML='<div class="note">Loading external AI image…</div>';const im=new Image();im.onload=()=>{$('ai').innerHTML='';$('ai').appendChild(im);$('ai').insertAdjacentHTML('beforeend','<p class="note">Generated by an external service (Pollinations) — real image generation, but outside MoodMorph’s control.</p>')};im.onerror=()=>$('ai').innerHTML='<p class="note">External image service unavailable or rate-limited. The built-in moodboard still works fully offline.</p>';im.src=u}
 document.querySelectorAll('.sw div').forEach(d=>d.onclick=()=>{navigator.clipboard?.writeText(d.dataset.c);$('cp').textContent='Copied '+d.dataset.c});
 $('png').onclick=exportPng;$('css').onclick=()=>{const c=`:root{--bg:${pal[0].c};--primary:${pal[1].c};--accent:${pal[2].c};--highlight:${pal[3].c};--text:${pal[4].c};--font-display:'${t.d}';--font-body:'${t.b}'}`;navigator.clipboard?.writeText(c);$('css').textContent='Copied!'};
 $('json').onclick=()=>dl(new Blob([JSON.stringify({prompt:text,params:{darkness:m.d,energy:m.e,elegance:m.el,warmth:m.w,hue:Math.round(m.H)},palette:pal,typography:t,direction:dir},null,2)]),'moodmorph.json');
 $('save').onclick=saveBoard;$('again').onclick=()=>{cur.seed=(cur.seed+7919)>>>0;drawArt($('art'),pal,m,cur.seed)};
}
function dl(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000)}
function wrap(g,txt,x,y,w,lh){let line='';for(const wd of txt.split(' ')){const tst=line+wd+' ';if(g.measureText(tst).width>w&&line){g.fillText(line,x,y);line=wd+' ';y+=lh}else line=tst}g.fillText(line,x,y);return y}
function exportPng(){
 const{pal,t,text,dir}=cur,c=document.createElement('canvas');c.width=1200;c.height=1500;const g=c.getContext('2d');
 g.fillStyle=pal[0].c;g.fillRect(0,0,1200,1500);g.drawImage($('art'),0,0,1200,800);
 g.fillStyle=pal[4].c;g.font=`600 56px '${t.d}',serif`;g.fillText(text,60,890);
 pal.forEach((p,i)=>{g.fillStyle=p.c;g.beginPath();g.roundRect(60+i*224,930,208,150,16);g.fill();g.fillStyle=pal[4].c;g.font="600 20px sans-serif";g.fillText(p.n+'  '+p.c,60+i*224,1112)});
 g.font=`500 28px '${t.b}',sans-serif`;g.fillStyle=pal[4].c;g.fillText(`${t.d} + ${t.b}`,60,1180);
 g.font=`400 24px '${t.b}',sans-serif`;g.globalAlpha=.85;wrap(g,dir,60,1240,1080,36);g.globalAlpha=.5;g.font="18px sans-serif";g.fillText("Made with MoodMorph",60,1470);
 c.toBlob(b=>dl(b,'moodboard.png'))
}
function store(){try{return JSON.parse(localStorage.getItem('mm')||'[]')}catch(e){return[]}}
function saveBoard(){const l=store().filter(x=>x.text!==cur.text);l.unshift({text:cur.text,seed:cur.seed});try{localStorage.setItem('mm',JSON.stringify(l.slice(0,20)))}catch(e){}renderSaved();$('save').textContent='Saved ✓'}
function renderSaved(){const l=store();$('savedBox').style.display=l.length?'block':'none';$('saved').innerHTML='';l.forEach((x,i)=>{const b=document.createElement('button');b.className='g';b.textContent=x.text;b.onclick=()=>{generate(x.text);cur.seed=x.seed;drawArt($('art'),cur.pal,cur.m,x.seed)};const d=document.createElement('button');d.className='g';d.textContent='×';d.title='Delete';d.onclick=()=>{try{localStorage.setItem('mm',JSON.stringify(store().filter(y=>y.text!==x.text)))}catch(e){}renderSaved()};$('saved').append(b,d)})}
$('f').onsubmit=e=>{e.preventDefault();generate($('q').value)};
$('morph').onchange=()=>{if(!cur)return;$('morph').checked?applyTheme(cur.pal,cur.t):resetTheme()};
EXAMPLES.forEach(x=>{const b=document.createElement('button');b.type='button';b.className='g';b.textContent=x;b.onclick=()=>generate(x);$('chips').appendChild(b)});
renderSaved();
</script></body></html>
